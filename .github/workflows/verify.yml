# Verification gate for Operator Key.
#
# Every job here must pass before `main` moves. The repository holds 465+ tests across
# three languages, and before this workflow existed nothing ran them automatically: a
# commit could reach the default branch entirely unverified. That was the single highest
# finding of the 2026-09-21 audit.
#
# Design notes:
#   * The Python suite is stdlib-only and needs no install step.
#   * The Rust jobs need GTK/WebKit because Tauri links against them on Linux.
#   * `cargo test --lib` covers the security boundaries (provider isolation, insertion
#     gates, process lifecycle) and does not need a display.
#   * Audits run with `--deny warnings` so a new advisory fails the build instead of
#     printing quietly into a log nobody reads.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a newly published advisory against an unchanged dependency is still caught.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # Called by release.yml, so a tag cannot publish something the suite has not verified.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
      - name: Production build
        run: npm run build

  python:
    name: python (catalog builder and adapters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 -m unittest discover -s tests -v

  rust:
    name: rust (native boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib

  audit:
    name: dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: npm audit
        run: npm audit --audit-level=moderate
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit
        # Building cargo-audit from source takes about 3.5 minutes on a clean runner.
        # Cache the installed binary so only the advisory scan itself runs each time.
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.22.2
      - name: cargo audit
        # Run cargo-audit directly rather than via rustsec/audit-check.
        #
        # Two reasons. The action calls the GitHub Checks API to publish results, which
        # fails with "Resource not accessible by integration" unless the workflow is
        # granted `checks: write` — a permission worth avoiding for a job that only needs
        # to read a lockfile. It also invokes cargo-audit from the repository root, so
        # `src-tauri/.cargo/audit.toml` is never discovered and the documented advisory
        # acknowledgements are silently ignored.
        #
        # `--deny warnings` makes that config meaningful: the seven transitive
        # unmaintained/unsound advisories listed there are accepted deliberately, and any
        # NEW advisory fails this job. Verified by removing one ID and watching it fail.
        working-directory: src-tauri
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          cargo audit --deny warnings

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits, not just the current tree.
          fetch-depth: 0
      - name: gitleaks
        # Run the gitleaks binary directly rather than through gitleaks-action.
        #
        # The action scans only the commits in the triggering event, and it ignores an
        # `args` override: a run on main reported "1 commits, scanned ~2133 bytes" against
        # a 46-commit, 767 KiB repository, and passing `detect --source .` through `with:`
        # changed nothing (still 1 commit / 789 bytes on the runner). A credential
        # committed at any earlier point was therefore never examined, while the job
        # still printed "No leaks detected".
        #
        # Invoking the binary scans the whole history: 87 commits, ~6.9 MB locally.
        # Verified in a scratch repository that a token committed two commits back is
        # MISSED by the delta scan (exit 0) and CAUGHT by this one (exit 1).
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose --exit-code 1

  no-machine-state:
    name: no machine state committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse host paths, personal identifiers and machine drift data
        run: bash scripts/ci/check-no-machine-state.sh
