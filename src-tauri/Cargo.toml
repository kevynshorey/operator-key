[package]
name = "operator-key"
version = "0.2.3"
description = "Keyboard-first command intelligence overlay"
authors = ["Operator Key contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "operator_key_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
